<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Smita ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    h1 {
      color: white;
      font-size: 2.2rem;
      margin-bottom: 15px;
    }
    video {
      width: 85%;
      max-width: 350px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    button {
      margin-top: 15px;
      padding: 10px 22px;
      border: none;
      border-radius: 20px;
      background: white;
      color: #ff4d6d;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>I love you, Smita ❤️</h1>

<video id="loveVideo" controls playsinline>
  <source src="https://drive.google.com/uc?export=download&id=1Ue7A_c8zWlQJp794AXGBLDyPqKu2f1LD" type="video/mp4">
</video>

<button onclick="document.getElementById('loveVideo').play()">
  Tap to play ❤️
</button>

</body>
</html>
